[package]
name = "rts-lockstep-engine"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "A modified Rust translation of the GPLv3 engine source released by Electronic Arts in 2025 (early, nothing playable)."
repository = "https://github.com/theodoreOnzGit/rts-lockstep-engine"
readme = "README.md"
keywords = ["rts", "lockstep", "deterministic", "game-engine", "simulation"]
categories = ["game-engines", "simulation"]
publish = false
# The pinned upstream source is a test-only reference; never package it.
# #229: the tests (the differential ones need `differential/` and `upstream/`), the docs, the scripts and the
# agents' instructions are not packaged either; without them the `.crate` fits under crates.io's 10 MB limit.
# `src/drafts/` stays (the `untested-drafts` feature compiles it), and so does `examples/` (`gate_wasm` is a
# declared target).
exclude = ["upstream/", "differential/", "tests/", "docs/", "scripts/", "AGENTS.md", "CLAUDE.md", "clippy.toml"]

[features]
default = []
# Compile the ORIGINAL upstream C++ (from the `upstream/` submodule) and link it
# into the crate, so tests can compare Rust and C++ outputs bit for bit.
# Needs a C++ compiler and `git submodule update --init`. Off by default.
differential = ["dep:cc"]
# Untested drafts (#202): translations written without compiling or testing, in `src/drafts/`. Off by default, so they
# cannot break the verified build. Each draft is compiled, differential-tested and moved out of `drafts` before it counts.
untested-drafts = []

[dependencies]
# PETIR, the owner's no_std core-numerics crate (outram-park-backend
# workspace), from crates.io at an exact version (owner decision 2026-10-17).
# ALL maths in the translation, f32 and f64, goes through `petir::Real`
# (which forwards to the pure-Rust `libm` crate), never `std`, so native and
# wasm builds compute the same bits. 0.0.1 implements `Real` for both f32 and
# f64. Default features off: they only add `uom` for petir's transfer
# functions.
petir = { version = "=0.0.1", default-features = false }

[build-dependencies]
cc = { version = "1", optional = true }

# Phase 1 gate (a) (batch I9d): the wasm side of the scripted game, a module with no imports (`scripts/gate_a.sh`).
[[example]]
name = "gate_wasm"
crate-type = ["cdylib"]

[package]
name = "rts-lockstep-engine"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "A modified Rust translation of the GPLv3 engine source released by Electronic Arts in 2025 (early, nothing playable)."
repository = "https://github.com/theodoreOnzGit/rts-lockstep-engine"
readme = "README.md"
publish = false
# The pinned upstream source is a test-only reference; never package it.
exclude = ["upstream/", "differential/"]

[features]
default = []
# Compile the ORIGINAL upstream C++ (from the `upstream/` submodule) and link it
# into the crate, so tests can compare Rust and C++ outputs bit for bit.
# Needs a C++ compiler and `git submodule update --init`. Off by default.
differential = ["dep:cc"]

[dependencies]
# PETIR, the owner's no_std core-numerics crate (outram-park-backend
# workspace), pinned by commit. ALL maths in the translation, f32 and f64,
# goes through `petir::Real` (which forwards to the pure-Rust `libm` crate),
# never `std`, so native and wasm builds compute the same bits. The `develop`
# commit, not `main` (8d31482d): petir on main has no acos/asin/atan/sqrt and
# no f32 functions (no `Real` trait). Default features off: they only add
# `uom` for petir's transfer functions.
petir = { git = "https://github.com/theodoreOnzGit/outram-park-backend", rev = "21a93d9460addf0e46f25559fd72fb429ee6d859", default-features = false }

[build-dependencies]
cc = { version = "1", optional = true }

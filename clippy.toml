# Owner direction (#40, 2026-11-06; #127): all maths goes through petir's function syntax,
# `petir::Real::sqrt(x)` (or `ww::wwmath::sin(x)` etc.), never float method syntax. `x.sqrt()` resolves
# to `std`'s inherent method (the platform libm on native, compiler-builtins on wasm), which can give
# native and wasm different bits for the transcendental functions and breaks lockstep. The exact
# operations (abs, floor, ceil, round, trunc, mul_add, rem_euclid, to_radians/to_degrees) are not listed.
# Applies to the client too (clippy finds this file from client/ by walking up).
disallowed-methods = [
    { path = "f32::sqrt", reason = "use `petir::Real::sqrt(x)` function syntax (#40, #127)" },
    { path = "f32::cbrt", reason = "use `petir::Real::cbrt(x)` function syntax (#40, #127)" },
